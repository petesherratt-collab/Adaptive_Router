<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Measured accuracy–remote-capacity frontier</title>
<desc id="chart-description">Strict routing accuracy plotted against remote-call rate for the four tested policies.</desc>
<rect width="960" height="620" fill="#ffffff"/>
