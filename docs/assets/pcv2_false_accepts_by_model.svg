<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Deterministic contracts caught false accepts at every model size</title>
<desc id="chart-description">Caught and remaining primary false accepts for three Gemma 3 model sizes.</desc>
<rect width="960" height="430" fill="#ffffff"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}.label{font-size:14px}.small{font-size:12px;fill:#5f6b7a}.value{font-size:13px;font-weight:700}.light{fill:#ffffff}</style>
<text x="52" y="48" class="title" text-anchor="start">Deterministic contracts caught false accepts at every model size</text>
<text x="52" y="74" class="subtitle" text-anchor="start">Counts among outputs that survived the legacy gate but were oracle-incorrect</text>
<rect x="650" y="91" width="16" height="16" rx="3" fill="#386cb0"/>
<text x="674" y="104" class="small" text-anchor="start">Caught</text>
<rect x="750" y="91" width="16" height="16" rx="3" fill="#b33a3a"/>
<text x="774" y="104" class="small" text-anchor="start">Remaining</text>
<line x1="220.0" y1="130" x2="220.0" y2="368" stroke="#d9dee7" stroke-width="1"/>
<text x="220.0" y="394" class="small" text-anchor="middle">0</text>
<line x1="387.5" y1="130" x2="387.5" y2="368" stroke="#d9dee7" stroke-width="1"/>
<text x="387.5" y="394" class="small" text-anchor="middle">20</text>
<line x1="555.0" y1="130" x2="555.0" y2="368" stroke="#d9dee7" stroke-width="1"/>
<text x="555.0" y="394" class="small" text-anchor="middle">40</text>
<line x1="722.5" y1="130" x2="722.5" y2="368" stroke="#d9dee7" stroke-width="1"/>
<text x="722.5" y="394" class="small" text-anchor="middle">60</text>
<line x1="890.0" y1="130" x2="890.0" y2="368" stroke="#d9dee7" stroke-width="1"/>
<text x="890.0" y="394" class="small" text-anchor="middle">80</text>
<text x="202" y="162" class="label" text-anchor="end">Gemma 3 270M</text>
<rect x="220" y="135" width="586.25" height="38" rx="3" fill="#386cb0"/>
<rect x="806.25" y="135" width="83.75" height="38" rx="3" fill="#b33a3a"/>
<text x="797.25" y="160" class="value light" text-anchor="end">70</text>
<text x="848.125" y="160" class="value light" text-anchor="middle">10</text>
<text x="942.0" y="160" class="small" text-anchor="start">87.5% caught</text>
<text x="202" y="244" class="label" text-anchor="end">Gemma 3 1B</text>
<rect x="220" y="217" width="410.375" height="38" rx="3" fill="#386cb0"/>
<rect x="630.375" y="217" width="134.0" height="38" rx="3" fill="#b33a3a"/>
<text x="621.375" y="242" class="value light" text-anchor="end">49</text>
