<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">The accepted-output error share fell sharply</title>
<desc id="chart-description">Wrong-answer share among accepted primary outputs before and after contracts.</desc>
<rect width="960" height="400" fill="#ffffff"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}.label{font-size:14px}.small{font-size:12px;fill:#5f6b7a}.value{font-size:13px;font-weight:700}.light{fill:#ffffff}</style>
<text x="52" y="48" class="title" text-anchor="start">The accepted-output error share fell sharply</text>
<text x="52" y="74" class="subtitle" text-anchor="start">Wrong answers as a share of outputs returned by each acceptance gate</text>
<line x1="260.0" y1="130" x2="260.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="260.0" y="364" class="small" text-anchor="middle">0%</text>
<line x1="350.0" y1="130" x2="350.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="350.0" y="364" class="small" text-anchor="middle">10%</text>
<line x1="440.0" y1="130" x2="440.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="440.0" y="364" class="small" text-anchor="middle">20%</text>
<line x1="530.0" y1="130" x2="530.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="530.0" y="364" class="small" text-anchor="middle">30%</text>
<line x1="620.0" y1="130" x2="620.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="620.0" y="364" class="small" text-anchor="middle">40%</text>
<line x1="710.0" y1="130" x2="710.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="710.0" y="364" class="small" text-anchor="middle">50%</text>
<line x1="800.0" y1="130" x2="800.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="800.0" y="364" class="small" text-anchor="middle">60%</text>
<line x1="890.0" y1="130" x2="890.0" y2="338" stroke="#d9dee7" stroke-width="1"/>
<text x="890.0" y="364" class="small" text-anchor="middle">70%</text>
<text x="52" y="162" class="label" text-anchor="start">Legacy gate</text>
<rect x="260" y="135" width="574.8175182481752" height="38" rx="3" fill="#b33a3a"/>
<text x="824.8175182481752" y="160" class="value light" text-anchor="end">63.9%</text>
<text x="260" y="191" class="small" text-anchor="start">175 wrong / 274 accepted</text>
<text x="52" y="248" class="label" text-anchor="start">After contracts</text>
<rect x="260" y="221" width="214.6153846153846" height="38" rx="3" fill="#386cb0"/>
<text x="464.61538461538464" y="246" class="value light" text-anchor="end">23.8%</text>
<text x="260" y="277" class="small" text-anchor="start">31 wrong / 130 accepted</text>
</svg>
