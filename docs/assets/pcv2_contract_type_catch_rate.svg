<text x="222" y="304" class="label" text-anchor="end">JSON format</text>
<rect x="240" y="279" width="464.2857142857143" height="36" rx="3" fill="#45a7c4"/>
<text x="713.2857142857142" y="303" class="value" text-anchor="start">25/35 · 71.43%</text>
<text x="222" y="376" class="label" text-anchor="end">Structured JSON</text>
<rect x="240" y="351" width="278.57142857142856" height="36" rx="3" fill="#45a7c4"/>
